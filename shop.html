  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body, h1, h2, p, ul, figure { margin: 0; padding: 0; }
    ul { list-style: none; }

    body {
      font-family: Sora, sans-serif;
      color: #0A1A44;
      background: #FFFFFF;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: #B7FF2A; color: #0A1A44; }

    a { color: inherit; }

    /* --- Pro Shop banner --------------------------------------------- */
    .pk-proshop {
      display: flex; align-items: center; gap: 16px;
      background: linear-gradient(100deg, #0A1A44 0%, #13235A 45%, #1E40FF 100%);
      border-radius: 22px; padding: 18px 20px; text-decoration: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 14px 30px -18px rgba(10,26,68,0.55);
    }
    .pk-proshop:hover { transform: translateY(-2px); box-shadow: 0 20px 36px -18px rgba(10,26,68,0.6); }
    /* The mark is a transparent cream PNG, so the Society blue is applied
       here rather than baked into the image (1119 KB webp -> 5 KB png). */
    .pk-proshop-logo {
      flex: none; width: 62px; height: 62px; border-radius: 14px;
      background: #1261A3; object-fit: contain; display: block;
    }
    .pk-proshop-open {
      flex: none; display: inline-flex; align-items: center; gap: 6px;
      background: #B7FF2A; color: #0A1A44; font-weight: 800; font-size: 14px;
      padding: 11px 18px; border-radius: 999px; white-space: nowrap;
    }

    /* --- Brand grid --------------------------------------------------- */
    .pk-brands {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px; margin-top: 16px;
    }
    .pk-brand {
      position: relative; aspect-ratio: 1 / 1; border-radius: 20px;
      border: 1px solid #E4E7F0; overflow: hidden; text-decoration: none;
      display: flex; align-items: center; justify-content: center; padding: 22px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .pk-brand:hover {
      transform: translateY(-3px); border-color: #C9D0E4;
      box-shadow: 0 16px 30px -18px rgba(10,26,68,0.4);
    }
    .pk-brand img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    .pk-brand-dark { background: #000000; border-color: #000000; }
    .pk-brand-light { background: #FFFFFF; }
    /* Shown only if the logo file is missing, so a tile is never blank. */
    .pk-brand-fallback { font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
    .pk-brand-dark .pk-brand-fallback { color: #FFFFFF; }

    .pk-brand-arrow {
      position: absolute; top: 12px; right: 12px; width: 30px; height: 30px;
      border-radius: 9px; background: #B7FF2A; display: flex; align-items: center; justify-content: center;
    }

    .pk-brand-empty {
      background: #F7F8FC; border-style: dashed; border-color: #D6DCEB;
      flex-direction: column; gap: 10px;
    }
    .pk-brand-empty:hover { border-color: #1E40FF; }
    /* Must stay on one line inside a tile that is only ~124px wide on a 320px
       phone, so the size tracks the viewport and tops out at 12px. */
    .pk-brand-empty-label {
      background: #FFFFFF; border-radius: 999px; padding: 8px 11px;
      font-size: clamp(10px, 3vw, 12px); font-weight: 600; color: rgba(10,26,68,0.6);
      white-space: nowrap; max-width: 100%;
    }

    .pk-partner {
      display: block; margin-top: 26px; background: #1E40FF; color: #FFFFFF;
      border-radius: 999px; padding: 16px; text-align: center;
      font-weight: 800; font-size: 16px; text-decoration: none;
      transition: background 0.18s ease;
    }
    .pk-partner:hover { background: #1736D8; }

    .pk-note {
      display: flex; align-items: flex-start; gap: 8px; margin-top: 18px;
      font-size: 13px; line-height: 1.6; color: rgba(10,26,68,0.5);
    }
    /* No nav bar above the heading, so a phone does not need 56px of
       headroom. Desktop keeps it. Overrides the inline padding. */
    @media (max-width: 640px) {
      .pk-shop-head { padding-top: 20px !important; padding-bottom: 22px !important; }
      .pk-brand { padding: 16px; }
    }
    @media (max-width: 380px) {
      .pk-brand { padding: 12px; }
      .pk-brand-empty-label { padding: 7px 9px; }
    }
    @media (max-width: 420px) {
      .pk-proshop { gap: 12px; padding: 16px; }
      .pk-proshop-logo { width: 52px; height: 52px; }
      .pk-proshop-open { padding: 9px 14px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div style="overflow-x: clip;">

    <header class="pk-shop-head" style="max-width: 760px; margin: 0 auto; padding: 56px 28px 30px; text-align: center;">
      <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; color: #1E40FF; margin-bottom: 14px;">SHOP</div>
      <h1 style="font-size: clamp(36px, 5vw, 56px); line-height: 1; letter-spacing: -0.035em; font-weight: 800;">Gear up.</h1>
      <p style="font-size: 15px; line-height: 1.6; color: rgba(10, 26, 68, 0.55); margin-top: 16px;">Pickleball brands in the Pickieball Society network. Paddles, gear, and apparel.</p>
    </header>

    <main style="max-width: 760px; margin: 0 auto; padding: 0 28px 80px;">

      <a class="pk-proshop" href="https://kevinkennedykie.com/pickieball-society-pro-shop" target="_blank" rel="noopener noreferrer">
        <img class="pk-proshop-logo" src="assets/shop/pickieball-society.png" alt="Pickieball Society">
        <span style="flex: 1; min-width: 0;">
          <span style="display: block; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; color: #FFFFFF;">Pro Shop</span>
          <span style="display: block; font-size: 14px; color: rgba(255,255,255,0.72); margin-top: 2px;">Paddles · gear · apparel</span>
        </span>
        <span class="pk-proshop-open">Open<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#0A1A44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M7 17L17 7M17 7H9M17 7v8"></path></svg></span>
      </a>

      <div class="pk-brands">

        <a class="pk-brand pk-brand-light" href="https://s.shopee.co.id/5VU3gByYsU" target="_blank" rel="noopener noreferrer" aria-label="Luzz Pickleball on Shopee">
          <span class="pk-brand-arrow"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#0A1A44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H9M17 7v8"></path></svg></span>
          <img src="assets/shop/luzz.png" alt="Luzz Pickleball" data-fallback="Luzz">
        </a>

        <a class="pk-brand pk-brand-dark" href="https://s.shopee.co.id/7AcHfDreL5" target="_blank" rel="noopener noreferrer" aria-label="Pikskin on Shopee">
          <span class="pk-brand-arrow"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#0A1A44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H9M17 7v8"></path></svg></span>
          <img src="assets/shop/pikskin.png" alt="Pikskin" data-fallback="PIKSKIN">
        </a>

        <a class="pk-brand pk-brand-light" href="https://wa.me/6288210971975?text=Hi%21%20I%20found%20JOOLA%20through%20Pickie.app.%20I%27m%20interested%20in%20your%20products%20and%20would%20like%20to%20know%20more%20about%20your%20paddle%20recommendations%2C%20pricing%2C%20and%20availability.%20Thank%20you%21" target="_blank" rel="noopener noreferrer" aria-label="JOOLA on WhatsApp">
          <span class="pk-brand-arrow"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#0A1A44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H9M17 7v8"></path></svg></span>
          <img src="assets/shop/joola.png" alt="JOOLA" data-fallback="JOOLA">
        </a>

        <a class="pk-brand pk-brand-empty" href="https://wa.me/6288210971975?text=Hi%21%20I%20am%20interested%20in%20partnering%20my%20pickleball%20brand%20with%20the%20Pickieball%20Society%20network." target="_blank" rel="noopener noreferrer" aria-label="Partner with us">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="rgba(10,26,68,0.32)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
          <span class="pk-brand-empty-label">Partner with us</span>
        </a>

      </div>

      <div class="pk-note">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="rgba(10,26,68,0.45)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px;"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4M12 8h.01"></path></svg>
        <span>Brands shown here are curated by location, so you see gear that is actually available near you.</span>
      </div>

      <a class="pk-partner" href="https://wa.me/6288210971975?text=Hi%21%20I%20am%20interested%20in%20partnering%20my%20pickleball%20brand%20with%20the%20Pickieball%20Society%20network." target="_blank" rel="noopener noreferrer">Partner with us</a>

    </main>

  </div>

  <script>
    // If a brand logo file is missing, drop in its name so the tile is never
    // blank. Grab the tile BEFORE removing the image, or closest() sees a
    // detached node and returns null.
    (function () {
      document.querySelectorAll('.pk-brand img').forEach(function (img) {
        var swap = function () {
          var tile = img.closest('.pk-brand');
          if (!tile || tile.querySelector('.pk-brand-fallback')) return;
          img.remove();
          var label = document.createElement('span');
          label.className = 'pk-brand-fallback';
          label.textContent = img.getAttribute('data-fallback') || img.alt;
          tile.appendChild(label);
        };
        img.addEventListener('error', swap);
        if (img.complete && img.naturalWidth === 0) swap();
      });
    })();
  </script>
